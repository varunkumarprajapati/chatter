services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: chatter_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatter_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - chatter_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatter_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: chatter_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: postgres
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chatter_network

volumes:
  postgres_data:
    name: chatter_postgres_data
  pgadmin_data:
    name: chatter_pgadmin_data

networks:
  chatter_network:
    driver: bridge
